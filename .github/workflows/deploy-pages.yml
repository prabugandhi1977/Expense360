name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you trigger a redeploy manually from the Actions tab without a new commit.
  workflow_dispatch:

# Only one deployment at a time; a new push cancels an in-progress one rather
# than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # Static, no-build site — the whole repo is the site root.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
