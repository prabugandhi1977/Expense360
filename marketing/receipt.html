<!doctype html>
<html><head><meta charset="utf-8"><title>Sample receipt</title>
<style>
  body{ margin:0; background:#fff; font-family:'Courier New', monospace; color:#111; }
  .r{ width:480px; margin:24px auto; padding:28px 32px; font-size:22px; line-height:1.45; }
  h1{ font-size:30px; text-align:center; margin:0 0 4px; }
  .c{ text-align:center; }
  .row{ display:flex; justify-content:space-between; }
  hr{ border:0; border-top:2px dashed #111; margin:14px 0; }
  .t{ font-weight:bold; font-size:26px; }
</style></head>
<body><div class="r">
  <h1>HARBOUR VIEW HOTEL</h1>
  <div class="c">12 Marine Drive, Mumbai</div>
  <div class="c">Tel 022 4000 1234</div>
  <hr>
  <div class="row"><span>Invoice No: INV-20931</span></div>
  <div class="row"><span>Date: 2026-10-14</span></div>
  <hr>
  <div class="row"><span>Room - Deluxe 1 night</span><span>$96.00</span></div>
  <div class="row"><span>Breakfast</span><span>$9.50</span></div>
  <div class="row"><span>Service tax</span><span>$6.30</span></div>
  <hr>
  <div class="row t"><span>TOTAL</span><span>$111.80</span></div>
  <hr>
  <div class="c">Lodging - Thank you for your stay</div>
</div></body></html>
